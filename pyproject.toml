[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viceclips-studio"
version = "1.0.0"
description = "ViceClips Studio: The Ultimate Content Heist Engine — Automated 9:16 Viral Shorts & Reels Generator"
readme = "README.md"
authors = [{ name = "ViceClips Studio Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.01.01",
    "requests>=2.31.0",
    "cloudinary>=1.40.0",
    "opencv-python>=4.9.0",
    "Pillow>=10.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.1"
]

[project.scripts]
clip-master = "clip_master:main"
publish-reels = "auto_publisher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
